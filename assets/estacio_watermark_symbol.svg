<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Top Quadrant Gradient -->
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bf2dc"/>
      <stop offset="50%" stop-color="#4ed7ba"/>
      <stop offset="100%" stop-color="#24bfa0"/>
    </linearGradient>
    <!-- Right Quadrant Gradient -->
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42d0f5"/>
      <stop offset="50%" stop-color="#1ea8db"/>
      <stop offset="100%" stop-color="#077bb5"/>
    </linearGradient>
    <!-- Bottom Quadrant Gradient -->
    <linearGradient id="gradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c7ec4"/>
      <stop offset="50%" stop-color="#055da3"/>
      <stop offset="100%" stop-color="#013f75"/>
    </linearGradient>
    <!-- Left Quadrant Gradient -->
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34ccba"/>
      <stop offset="50%" stop-color="#15a698"/>
      <stop offset="100%" stop-color="#0d7a82"/>
    </linearGradient>
  </defs>

  <g transform="translate(150, 150) rotate(45)">
    <!-- Main Diamond is 200x200 (-100 to 100). Gap of 3px between quadrants -->
    <!-- Top Quadrant (-100 to -3, -100 to -3) -->
    <g fill="url(#gradTop)">
      <rect x="-97" y="-97" width="94" height="94" rx="2"/>
    </g>
    <!-- Right Quadrant (3 to 97, -97 to -3) -->
    <g fill="url(#gradRight)">
      <rect x="3" y="-97" width="94" height="94" rx="2"/>
    </g>
    <!-- Bottom Quadrant (3 to 97, 3 to 97) -->
    <g fill="url(#gradBottom)">
      <rect x="3" y="3" width="94" height="94" rx="2"/>
    </g>
    <!-- Left Quadrant (-97 to -3, 3 to 97) -->
    <g fill="url(#gradLeft)">
      <rect x="-97" y="3" width="94" height="94" rx="2"/>
    </g>

    <!-- Internal 3x3 white grid lines inside each quadrant -->
    <!-- Top Quadrant Grid -->
    <line x1="-66" y1="-97" x2="-66" y2="-3" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="-35" y1="-97" x2="-35" y2="-3" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="-97" y1="-66" x2="-3" y2="-66" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="-97" y1="-35" x2="-3" y2="-35" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

    <!-- Right Quadrant Grid -->
    <line x1="34" y1="-97" x2="34" y2="-3" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="65" y1="-97" x2="65" y2="-3" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="3" y1="-66" x2="97" y2="-66" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="3" y1="-35" x2="97" y2="-35" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

    <!-- Bottom Quadrant Grid -->
    <line x1="34" y1="3" x2="34" y2="97" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="65" y1="3" x2="65" y2="97" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="3" y1="34" x2="97" y2="34" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="3" y1="65" x2="97" y2="65" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

    <!-- Left Quadrant Grid -->
    <line x1="-66" y1="3" x2="-66" y2="97" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="-35" y1="3" x2="-35" y2="97" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="-97" y1="34" x2="-3" y2="34" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="-97" y1="65" x2="-3" y2="65" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  </g>
</svg>
